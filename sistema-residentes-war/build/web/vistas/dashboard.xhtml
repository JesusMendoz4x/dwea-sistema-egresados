<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:p="http://primefaces.org/ui"
    template="/templates/principal.xhtml">

    <ui:define name="title">
        Dashboard
    </ui:define>

    <ui:define name="content">

        <div class="page-header">
            <div>
                <h1>Dashboard</h1>
                <p>Resumen general del sistema administrativo.</p>
            </div>
        </div>

        <h:form id="dashboardForm">

            <!-- Resumen general -->
            <h:panelGroup layout="block" rendered="#{not aDashboard.datosDisponibles}">
                <p role="alert"><h:outputText value="#{aDashboard.error}"/></p>
            </h:panelGroup>
            <h:panelGroup layout="block" styleClass="dashboard-cards" rendered="#{aDashboard.datosDisponibles}">

                <p:panel header="Vacantes registradas">
                    <h2><h:outputText value="#{aDashboard.resumen.vacantes}"/></h2>
                    <h:outputText value="Total registrado"/>
                </p:panel>

                <p:panel header="Egresados registrados">
                    <h2><h:outputText value="#{aDashboard.resumen.egresados}"/></h2>
                    <h:outputText value="Total registrado"/>
                </p:panel>

                <p:panel header="Mensajes registrados">
                    <h2><h:outputText value="#{aDashboard.resumen.mensajes}"/></h2>
                    <h:outputText value="Total registrado"/>
                </p:panel>

                <p:panel header="Administradores registrados">
                    <h2><h:outputText value="#{aDashboard.resumen.administradores}"/></h2>
                    <h:outputText value="Total registrado"/>
                </p:panel>

                <p:panel header="Eventos registrados"><h2>#{aDashboard.resumen.eventos}</h2></p:panel>
                <p:panel header="Credenciales pendientes"><h2>#{aDashboard.resumen.credencialesPendientes}</h2></p:panel>
            </h:panelGroup>

            <br/>

            <!-- Accesos rápidos -->
            <p:panel header="Accesos rápidos">

                <p:commandButton
                    value="Publicar vacante"
                    icon="ui-icon-plus"
                    type="button"
                    onclick="window.location='#{request.contextPath}/vistas/vacantes/publicar.xhtml'"/>

                <p:commandButton
                    value="Consultar vacantes"
                    icon="ui-icon-search"
                    type="button"
                    onclick="window.location='#{request.contextPath}/vistas/vacantes/consultar.xhtml'"/>

                <p:commandButton
                    value="Credenciales"
                    icon="ui-icon-person"
                    type="button"
                    onclick="window.location='#{request.contextPath}/vistas/credenciales/index.xhtml'"/>

            </p:panel>

            <br/>

            <p:panel header="Accesos de gestión"><p:button value="Eventos" outcome="/vistas/comunicacion/eventos"/><p:button value="Credenciales" outcome="/vistas/credenciales/index"/></p:panel>
        </h:form>

    </ui:define>

</ui:composition>
