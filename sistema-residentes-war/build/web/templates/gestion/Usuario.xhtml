<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:f="http://xmlns.jcp.org/jsf/core" xmlns:p="http://primefaces.org/ui">
<h:form id="gestionUsuario">
<p:messages id="mensajes" showDetail="true"/>
<p:commandButton value="Actualizar registros y opciones" action="#{aUsuario.cargar}" process="@this" update="@form" style="margin-bottom:12px"/>

<p:panel header="Usuarios" style="margin-bottom:20px">
<p:dataTable value="#{aUsuario.registros}" var="fila" paginator="true" rows="10" emptyMessage="No hay registros. Crea uno en el formulario inferior.">
<p:column headerText="Nombre" filterBy="#{fila.nombre}" filterMatchMode="contains"><h:outputText value="#{fila.nombre}"/></p:column>
<p:column headerText="Correo" filterBy="#{fila.correo}" filterMatchMode="contains"><h:outputText value="#{fila.correo}"/></p:column>
<p:column headerText="Rol" filterBy="#{fila.rol}" filterMatchMode="contains"><h:outputText value="#{fila.rol}"/></p:column>
<p:column headerText="Estado" filterBy="#{fila.estado}" filterMatchMode="contains"><h:outputText value="#{fila.estado}"/></p:column>
<p:column headerText="Acciones"><p:commandButton value="Editar" action="#{aUsuario.editar(fila)}" process="@this" update="@form" resetValues="true"/><p:commandButton value="Eliminar" action="#{aUsuario.eliminar(fila)}" process="@this" update="@form" onclick="if (!confirm('¿Eliminar este usuario?')) return false;"/></p:column>
</p:dataTable></p:panel>
<p:panel header="Nuevo registro / edición">
<div class="gestion-grid">
<div><h:outputLabel for="campo0" value="Nombre"/><p:inputText id="campo0" value="#{aUsuario.actual.nombre}" required="true" label="Nombre" maxlength="255"/></div>
<div><h:outputLabel for="campo1" value="Correo"/><p:inputText id="campo1" value="#{aUsuario.actual.correo}" required="true" label="Correo" maxlength="255"/></div>
<div><h:outputLabel for="campo2" value="Rol"/><p:selectOneMenu id="campo2" value="#{aUsuario.actual.rol}" required="true" label="Rol"><f:selectItem itemLabel="Selecciona..." itemValue="#{null}" noSelectionOption="true"/><f:selectItems value="#{aCatalogos.roles}"/></p:selectOneMenu></div>
<div><h:outputLabel for="campo3" value="Estado"/><p:selectOneMenu id="campo3" value="#{aUsuario.actual.estado}" required="false" label="Estado"><f:selectItem itemLabel="Selecciona..." itemValue="#{null}" noSelectionOption="true"/><f:selectItems value="#{aCatalogos.estadosUsuario}"/></p:selectOneMenu></div>
<div><h:outputLabel for="clave" value="Contraseña nueva (opcional, mínimo 10 caracteres)"/><p:password id="clave" value="#{aUsuario.clave}" autocomplete="new-password"/></div></div><div class="gestion-actions"><p:commandButton value="Guardar" action="#{aUsuario.guardar}" process="@form" update="@form"/>
<p:commandButton value="Nuevo / cancelar edición" action="#{aUsuario.nuevo}" process="@this" update="@form" resetValues="true"/></div>
</p:panel></h:form></ui:composition>
