<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:f="http://xmlns.jcp.org/jsf/core" xmlns:p="http://primefaces.org/ui">
<h:form id="gestionEvento"><p:messages showDetail="true"/>
<p:commandButton value="Actualizar" action="#{aEvento.cargar}" process="@this" update="@form"/>
<p:panel header="Registros"><p:dataTable value="#{aEvento.registros}" var="fila" paginator="true" rows="10" emptyMessage="No hay registros.">
<p:column headerText="Título" filterBy="#{fila.titulo}" filterMatchMode="contains"><h:outputText value="#{fila.titulo}"/></p:column>
<p:column headerText="Tipo de evento" filterBy="#{fila.tipo}" filterMatchMode="contains"><h:outputText value="#{fila.tipo}"/></p:column>
<p:column headerText="Fecha y hora" filterBy="#{fila.fecha}" filterMatchMode="contains"><h:outputText value="#{fila.fecha}"/></p:column>
<p:column headerText="Sede" filterBy="#{fila.sede}" filterMatchMode="contains"><h:outputText value="#{fila.sede}"/></p:column>
<p:column headerText="Descripción" filterBy="#{fila.descripcion}" filterMatchMode="contains"><h:outputText value="#{fila.descripcion}"/></p:column>
<p:column headerText="Acciones"><p:commandButton value="Editar" action="#{aEvento.editar(fila)}" process="@this" update="@form" resetValues="true"/>
<p:commandButton value="Eliminar" action="#{aEvento.eliminar(fila)}" process="@this" update="@form" onclick="if (!confirm('¿Eliminar este registro?')) return false;"/>
</p:column></p:dataTable></p:panel><p:panel header="Nuevo registro / edición"><div class="gestion-grid"><div><h:outputLabel for="campo0" value="Título"/><p:inputText id="campo0" value="#{aEvento.actual.titulo}" required="true" label="Título" maxlength="255"/></div><div><h:outputLabel for="campo1" value="Tipo de evento"/><p:selectOneMenu id="campo1" value="#{aEvento.actual.tipo}" required="true" label="Tipo de evento"><f:selectItem itemLabel="Selecciona..." itemValue="#{null}" noSelectionOption="true"/><f:selectItems value="#{aCatalogos.tiposEvento}"/></p:selectOneMenu></div><div><h:outputLabel for="campo2" value="Fecha y hora"/><p:calendar id="campo2" value="#{aEvento.actual.fecha}" required="true" label="Fecha y hora" pattern="dd/MM/yyyy HH:mm" navigator="true"/></div><div><h:outputLabel for="campo3" value="Sede"/><p:inputText id="campo3" value="#{aEvento.actual.sede}" required="true" label="Sede" maxlength="255"/></div><div><h:outputLabel for="campo4" value="Descripción"/><p:inputTextarea id="campo4" value="#{aEvento.actual.descripcion}" required="false" label="Descripción" rows="3" maxlength="1000"/></div></div><div class="gestion-actions"><p:commandButton value="Guardar" action="#{aEvento.guardar}" update="@form" process="@form"/>
<p:commandButton value="Nuevo / cancelar" action="#{aEvento.nuevo}" update="@form" process="@this" resetValues="true"/></div></p:panel></h:form></ui:composition>
