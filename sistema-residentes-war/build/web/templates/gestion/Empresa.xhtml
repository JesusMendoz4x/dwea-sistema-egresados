<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:f="http://xmlns.jcp.org/jsf/core" xmlns:p="http://primefaces.org/ui">
<h:form id="gestionEmpresa">
<p:messages id="mensajes" showDetail="true"/>
<p:commandButton value="Actualizar registros y opciones" action="#{aEmpresa.cargar}" process="@this" update="@form" style="margin-bottom:12px"/>

<p:panel header="Empresas" style="margin-bottom:20px">
<p:dataTable rowStyleClass="registro-#{fila.idEmpresa}" value="#{aEmpresa.registros}" var="fila" paginator="true" rows="10" emptyMessage="No hay registros. Crea uno en el formulario inferior.">
<p:column headerText="Nombre" filterBy="#{fila.nombre}" filterMatchMode="contains"><h:outputText value="#{fila.nombre}"/></p:column>
<p:column headerText="Acciones"><p:commandButton value="Editar" action="#{aEmpresa.editar(fila)}" process="@this" update="@form" resetValues="true"/><p:commandButton value="Eliminar" action="#{aEmpresa.eliminar(fila)}" process="@this" update="@form" onclick="if (!confirm('¿Eliminar este registro?')) return false;"/></p:column>
</p:dataTable></p:panel>
<p:panel header="Datos de la empresa">
<div class="ficha ficha-empresa">
<div class="gestion-grid"><div><h:outputLabel for="campo0" value="Nombre"/><p:inputText id="campo0" value="#{aEmpresa.actual.nombre}" required="true" label="Nombre" maxlength="255"/></div></div>
</div><div class="gestion-actions"><p:commandButton value="Guardar" action="#{aEmpresa.guardar}" process="@form" update="@form"/>
<p:commandButton value="Nuevo / cancelar edición" action="#{aEmpresa.nuevo}" process="@this" update="@form" resetValues="true"/></div>
</p:panel></h:form></ui:composition>
