<?xml version="1.0" encoding="UTF-8"?>

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <!-- Resto de tu código -->


    <h:head>
        <title>Iniciar Sesion</title>
        <link rel="stylesheet"
              type="text/css"   
              href="#{request.contextPath}/resource/css/estilos.css"/>    </h:head>

    <h:body>

        <div class="login-container">

            <div class="login-box">

                <h2 class="login-title">Bienvenido</h2>

                <p class="login-subtitle">
                    Ingresa tus credenciales
                </p>

                <h:form id="acceso">

                    <p:messages id="messages"/>

                    <div class="login-field">
                        <p:outputLabel for="correo"
                                       value="Correo electrónico"/>

                        <p:inputText id="correo" value="#{aAcceso.correo}" required="true" label="Correo"
                                     placeholder="usuario@correo.com"
                                     style="width:100%"/>
                    </div>

                    <div class="login-field">
                        <p:outputLabel for="password"
                                       value="Contraseña"/>

                        <p:password id="password" value="#{aAcceso.clave}" required="true" label="Contraseña"
                                    placeholder="Tu contraseña"
                                    style="width:100%"/>
                    </div>

                    <p:commandButton value="Iniciar sesión"
                                     styleClass="login-button"
                                     action="#{aAcceso.entrar}" ajax="false"/>

                </h:form>

            </div>

        </div>

    </h:body>
</html>
