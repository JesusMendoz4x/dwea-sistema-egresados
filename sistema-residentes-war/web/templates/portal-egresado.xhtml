<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="es"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
<h:head>
    <title><ui:insert name="title">Inicio</ui:insert> | Portal de egresados</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="stylesheet" href="#{request.contextPath}/resource/css/portal-egresado.css"/>
</h:head>
<h:body>
    <h:panelGroup id="cabeceraPortal" layout="block" styleClass="portal-egresados-header" pt:role="banner">
        <div class="barra-contenido">
            <div class="portal-logos-institucionales">
                <img src="#{request.contextPath}/resource/img/ITO.png" width="56" height="54"
                     alt="Instituto Tecnológico de Oaxaca"/>
                <img src="#{request.contextPath}/resource/img/TecNM.png" width="132" height="65"
                     alt="Tecnológico Nacional de México"/>
            </div>
            <nav class="barra-navegacion" aria-label="Navegación del portal">
                <h:link value="Feed" outcome="/vistas/egresado/vacantes" styleClass="barra-enlace barra-enlace-vacantes"
                        pt:aria-current="#{view.viewId eq '/vistas/egresado/vacantes.xhtml' ? 'page' : 'false'}"/>
                <h:link value="Noticias" outcome="/vistas/egresado/noticias" styleClass="barra-enlace barra-enlace-noticias"
                        pt:aria-current="#{view.viewId eq '/vistas/egresado/noticias.xhtml' ? 'page' : 'false'}"/>
                <h:link value="Notificaciones" outcome="/vistas/egresado/notificaciones" styleClass="barra-enlace barra-enlace-notificaciones"
                        pt:aria-current="#{view.viewId eq '/vistas/egresado/notificaciones.xhtml' ? 'page' : 'false'}"/>
                <h:link value="Mi perfil" outcome="/vistas/egresado/perfil" styleClass="barra-enlace barra-enlace-perfil"
                        pt:aria-current="#{view.viewId eq '/vistas/egresado/perfil.xhtml' ? 'page' : 'false'}"/>
            </nav>
            <details class="cuenta">
                <summary>Mi cuenta</summary>
                <div class="cuenta-menu">
                    <strong><h:outputText value="#{aAcceso.usuario.nombre}"/></strong>
                    <h:form>
                        <h:commandButton value="Cerrar sesión" action="#{aAcceso.salir}" immediate="true"/>
                    </h:form>
                </div>
            </details>
        </div>
    </h:panelGroup>

    <h:panelGroup id="contenidoPortal" layout="block" styleClass="contenedor" pt:role="main">
        <ui:insert name="content"/>
    </h:panelGroup>
</h:body>
</html>
