<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="/templates/portal-egresado.xhtml">
    <ui:define name="title">Noticias</ui:define>
    <ui:define name="content">
        <h1>Noticias</h1>
        <h2 class="feed-titulo">Próximos eventos</h2>
        <h:panelGroup layout="block" rendered="#{empty aPortalComunicacion.proximosEventos and not aPortalComunicacion.errorEventos}">
            Por el momento no hay eventos próximos.
        </h:panelGroup>
        <h:panelGroup layout="block" pt:role="alert" rendered="#{aPortalComunicacion.errorEventos}">
            No pudimos cargar los eventos. Inténtalo más tarde.
        </h:panelGroup>
        <ui:repeat value="#{aPortalComunicacion.proximosEventos}" var="evento">
            <article class="vacante">
                <h3><h:outputText value="#{evento.titulo}"/></h3>
                <p class="empresa"><h:outputText value="#{evento.tipo}"/></p>
                <p>
                    <h:outputText value="#{evento.fecha}"><f:convertDateTime pattern="dd/MM/yyyy HH:mm" timeZone="#{aPortalComunicacion.zonaHoraria}"/></h:outputText>
                    · <h:outputText value="#{evento.sede}"/>
                </p>
                <h:panelGroup layout="block" styleClass="detalle" rendered="#{not empty evento.descripcion}">
                    <h:outputText value="#{evento.descripcion}"/>
                </h:panelGroup>
            </article>
        </ui:repeat>
    </ui:define>
</ui:composition>
