<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="/templates/portal-egresado.xhtml">
    <ui:define name="title">Feed</ui:define>
    <ui:define name="content">
        <h1>Feed</h1>
        <h2 class="feed-titulo">Vacantes vigentes</h2>
        <h:panelGroup layout="block" rendered="#{aPortalEgresado.error}" pt:role="alert">
            No pudimos cargar las vacantes. Vuelve a intentarlo en unos minutos.
        </h:panelGroup>
        <h:panelGroup layout="block" rendered="#{not aPortalEgresado.error and empty aPortalEgresado.vacantes}">
            Por el momento no hay vacantes vigentes.
        </h:panelGroup>
        <ui:repeat value="#{aPortalEgresado.vacantes}" var="vacante">
            <article class="vacante">
                <p class="empresa"><h:outputText value="#{vacante.idEmpresa.nombre}"/></p>
                <h3><h:outputText value="#{vacante.puesto}"/></h3>
                <p><h:outputText value="#{vacante.ubicacion}"/></p>
                <p>Vigente hasta el <h:outputText value="#{vacante.vigencia}"><f:convertDateTime pattern="dd/MM/yyyy" timeZone="#{aPortalEgresado.zonaHoraria}" /></h:outputText></p>
                <p class="detalle"><h:outputText value="#{vacante.descripcion}"/></p>
                <h:panelGroup layout="block" rendered="#{not empty vacante.requisitos}">
                    <h4>Requisitos</h4>
                    <p class="detalle"><h:outputText value="#{vacante.requisitos}"/></p>
                </h:panelGroup>
            </article>
        </ui:repeat>
    </ui:define>
</ui:composition>
