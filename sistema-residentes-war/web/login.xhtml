<?xml version="1.0" encoding="UTF-8"?>

<html xmlns="http://www.w3.org/1999/xhtml" lang="es"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
      xmlns:p="http://primefaces.org/ui">

    <h:head>
        <title>Iniciar sesión | Sistema de egresados</title>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <link rel="stylesheet"
              type="text/css"   
              href="#{request.contextPath}/resource/css/estilos.css"/>
        <script src="#{request.contextPath}/resource/js/login.js" defer="defer"></script>
    </h:head>

    <h:body>

        <main class="login-container">

            <div class="login-box">

                <div class="login-logos">
                    <img class="login-logo-ito" width="52" height="50" src="#{request.contextPath}/resource/img/ITO.png" alt="Instituto Tecnológico de Oaxaca"/>
                    <span class="login-logo-separador" aria-hidden="true"></span>
                    <img class="login-logo-tecnm" width="136" height="67" src="#{request.contextPath}/resource/img/TecNM.png" alt="Tecnológico Nacional de México"/>
                </div>

                <h1 class="login-title">Iniciar sesión</h1>

                <p class="login-subtitle">
                    Accede al sistema de egresados.
                </p>

                <h:form id="acceso">

                    <p:messages id="messages"/>

                    <div class="login-field">
                        <h:outputLabel for="correo"
                                       value="Correo electrónico"/>

                        <p:inputText id="correo" value="#{aAcceso.correo}" required="true" label="Correo"
                                     placeholder="usuario@correo.com" pt:autocomplete="username" pt:inputmode="email"/>
                    </div>

                    <div class="login-field">
                        <h:outputLabel for="password"
                                       value="Contraseña"/>

                        <div class="login-password">
                            <p:password id="password" value="#{aAcceso.clave}" required="true"
                                        label="Contraseña" pt:autocomplete="current-password"/>
                            <button id="ver-contrasena" class="login-password-toggle" type="button"
                                    aria-controls="acceso:password" aria-label="Mostrar contraseña"
                                    hidden="hidden"><span class="login-eye" aria-hidden="true"></span></button>
                        </div>
                    </div>

                    <p:commandButton value="Entrar"
                                     styleClass="login-button"
                                     action="#{aAcceso.entrar}" ajax="false"/>

                </h:form>

            </div>

        </main>

    </h:body>
</html>
