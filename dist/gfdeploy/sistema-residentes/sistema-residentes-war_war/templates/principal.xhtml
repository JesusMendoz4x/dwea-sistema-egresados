<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:jsf="http://xmlns.jcp.org/jsf" xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">

    <h:head>
        <title>
            <ui:insert name="title">AdminPanel</ui:insert>
        </title>

        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

        <link rel="stylesheet" type="text/css"
              href="#{request.contextPath}/resource/css/estilos.css"/>
    </h:head>

    <h:body>

        <div class="app-container" id="appContainer">

            <aside class="sidebar" id="sidebar">

                <div class="sidebar-header">
                    <div class="brand">
                        <span class="brand-name">AdminPanel</span>
                    </div>
                </div>

                <nav class="sidebar-navigation">
                    <h:form id="menuForm">
                        <p:panelMenu widgetVar="menuPrincipal" styleClass="sidebar-menu">

                            <p:submenu label="General" icon="ui-icon-home">
                                <p:menuitem value="Dashboard" icon="ui-icon-home"
                                            outcome="/vistas/dashboard" styleClass="#{view.viewId eq '/vistas/dashboard.xhtml' ? 'opcion-actual' : ''}"/>
                            </p:submenu>

                            <p:submenu label="Vacantes" icon="ui-icon-suitcase">
                                <p:menuitem value="Consultar vacantes" icon="ui-icon-search"
                                            outcome="/vistas/vacantes/consultar" styleClass="#{view.viewId eq '/vistas/vacantes/consultar.xhtml' ? 'opcion-actual' : ''}"/>
                                <p:menuitem value="Publicar vacante" icon="ui-icon-plus"
                                            outcome="/vistas/vacantes/publicar" styleClass="#{view.viewId eq '/vistas/vacantes/publicar.xhtml' ? 'opcion-actual' : ''}"/>
                                <p:menuitem value="Editar vacantes" icon="ui-icon-pencil"
                                            outcome="/vistas/vacantes/editar" styleClass="#{view.viewId eq '/vistas/vacantes/editar.xhtml' ? 'opcion-actual' : ''}"/>
                            </p:submenu>

                            <p:submenu label="Comunicación" icon="ui-icon-mail-closed">
                                <p:menuitem value="Mensajería" icon="ui-icon-mail-closed"
                                            outcome="/vistas/comunicacion/mensajeria" styleClass="#{view.viewId eq '/vistas/comunicacion/mensajeria.xhtml' ? 'opcion-actual' : ''}"/>
                                <p:menuitem value="Conversaciones" icon="ui-icon-comment"
                                            outcome="/vistas/comunicacion/conversaciones" styleClass="#{view.viewId eq '/vistas/comunicacion/conversaciones.xhtml' ? 'opcion-actual' : ''}"/>
                                <p:menuitem value="Eventos" icon="ui-icon-calendar"
                                            outcome="/vistas/comunicacion/eventos" styleClass="#{view.viewId eq '/vistas/comunicacion/eventos.xhtml' ? 'opcion-actual' : ''}"/>
                                <p:menuitem value="Avisos" icon="ui-icon-flag"
                                            outcome="/vistas/comunicacion/avisos" styleClass="#{view.viewId eq '/vistas/comunicacion/avisos.xhtml' ? 'opcion-actual' : ''}"/>
                            </p:submenu>

                            <p:submenu label="Egresados" icon="ui-icon-person">
                                <p:menuitem value="Gestión de egresados" icon="ui-icon-person"
                                            outcome="/vistas/egresados/gestionEgresados" styleClass="#{view.viewId eq '/vistas/egresados/gestionEgresados.xhtml' ? 'opcion-actual' : ''}" rendered="#{aAcceso.usuario.rol eq 'Administrador'}"/>
                                <p:menuitem value="Credenciales" icon="ui-icon-person" outcome="/vistas/credenciales/index" styleClass="#{view.viewId eq '/vistas/credenciales/index.xhtml' ? 'opcion-actual' : ''}"/>
                            </p:submenu>

                        <p:submenu label="Administración" icon="ui-icon-gear" rendered="#{aAcceso.usuario.rol eq 'Administrador'}">
<p:menuitem value="Usuarios y roles" outcome="/vistas/administracion/usuarios" styleClass="#{view.viewId eq '/vistas/administracion/usuarios.xhtml' ? 'opcion-actual' : ''}"/>
<p:menuitem value="Empresas" outcome="/vistas/administracion/empresas" styleClass="#{view.viewId eq '/vistas/administracion/empresas.xhtml' ? 'opcion-actual' : ''}"/>
</p:submenu><p:submenu label="Sesión" icon="ui-icon-person"><p:menuitem value="Cerrar sesión" action="#{aAcceso.salir}" ajax="false"/></p:submenu>
</p:panelMenu>
                    </h:form>
                </nav>

                <div class="sidebar-footer">
                    <div class="user-avatar">AD</div>
                    <div class="user-information">
                        <strong>#{aAcceso.usuario.nombre}</strong>
                        <span>#{aAcceso.usuario.rol}</span>
                    </div>
                </div>

            </aside>

            <div class="main-content">

                <header class="topbar" style="padding: 10px 20px; border-bottom: 1px solid #d9d9d9; background: #ffffff;">
                    <table style="width: 100%; border-collapse: collapse; border: none;">
                        <tr>
                            <td style="text-align: left; vertical-align: middle;">
                                <span style="font-weight: bold; font-size: 1.1em; color: #333;">
                                    Sistema Administrativo - Gestión y Vinculación
                                </span>
                            </td>
                            <td style="text-align: right; vertical-align: middle; width: 120px;">
                                <h:form id="formNotif" style="margin: 0; padding: 0;">
                                    <p:button value="Avisos" outcome="/vistas/comunicacion/avisos" icon="ui-icon-mail-closed"/>
                                </h:form>
                            </td>
                        </tr>
                    </table>
                </header>

                <main class="page-content">
                    <ui:insert name="content">
                        <h1>Bienvenido</h1>
                    </ui:insert>
                </main>

            </div>

        </div>

    <script src="#{request.contextPath}/resource/js/seleccion.js"></script>
    </h:body>
</html>
